name: Deploy WASL Dashboard to Firebase Hosting

on:
  push:
    branches:
      - main
      - master
      - complaint_feature

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Deploy Wasl Dashboard to Firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: wasl-cdcb6
